<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kamusta Ka?</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #123c69 0%, #071a2d 45%, #000000 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px 170px;
      overflow-x: hidden;
    }

    /* Main Card */
    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 45px 30px;
      background: rgba(0, 0, 0, 0.60);
      border: 1px solid rgba(77, 195, 255, 0.35);
      border-radius: 25px;
      box-shadow: 0 0 40px rgba(0, 170, 255, 0.15);
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 12px;
      color: #7ddcff;
      text-shadow: 0 0 20px rgba(80, 200, 255, 0.5);
    }

    .subtitle {
      color: #b8dff5;
      font-size: 1.1rem;
      margin-bottom: 35px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: 0.25s ease;
    }

    .ok {
      background: #087ca7;
      box-shadow: 0 0 15px rgba(8, 124, 167, 0.35);
    }

    .not-ok {
      background: #172f52;
      border: 1px solid #4dc3ff;
    }

    button:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 0 25px rgba(77, 195, 255, 0.45);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Video */
    #videoContainer {
      display: none;
      margin-top: 10px;
      animation: fadeIn 0.6s ease;
    }

    video {
      width: 100%;
      max-height: 380px;
      border-radius: 15px;
      background: #000;
      border: 1px solid rgba(77, 195, 255, 0.4);
      box-shadow: 0 0 25px rgba(0, 170, 255, 0.2);
    }

    .back {
      margin-top: 18px;
      background: transparent;
      border: 1px solid #345b7d;
      color: #9edcff;
      padding: 10px 18px;
      font-size: 0.9rem;
    }

    /* Coder Information */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.90);
      border-top: 1px solid rgba(77, 195, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .coder {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    /* Coder Picture */
    .coder img {
       width: 120px;
       height: 150px;
       object-fit: cover;
       border-radius: 15px;
       border: 2px solid #4dc3ff;
       box-shadow: 0 0 20px rgba(77, 195, 255, 0.35);
    }

    .coder-text {
      text-align: left;
    }

    .coder-text h3 {
      color: #7ddcff;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .coder-text p {
      color: #9fc8df;
      font-size: 12px;
      margin: 2px 0;
    }

    .coder-text strong {
      color: #d7f3ff;
    }

    .copyright {
      margin-top: 5px !important;
      color: #6389a0 !important;
      font-size: 10px !important;
    }

    /* Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile */
    @media (max-width: 500px) {

      body {
        padding-bottom: 180px;
      }

      .container {
        padding: 35px 20px;
      }

      h1 {
        font-size: 2.3rem;
      }

      button {
        width: 100%;
      }

      .coder img {
        width: 55px;
        height: 55px;
      }

      .coder-text h3 {
        font-size: 14px;
      }

      .coder-text p {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- MAIN WEBSITE -->
  <div class="container">

    <!-- QUESTION -->
    <div id="question">

      <h1>MASAKIT BA?</h1>

      <p class="subtitle">
        SAGOTTTTTTT!!!!!
      </p>

      <div class="buttons">

        <button class="ok" onclick="playVideo('okVideo')">
          OO
        </button>

        <button class="not-ok" onclick="playVideo('notOkVideo')">
          Hindi
        </button>

      </div>

    </div>


    <!-- VIDEO SECTION -->
    <div id="videoContainer">

      <!-- VIDEO PARA SA "OK LANG AKO" -->
      <video id="okVideo" controls>
        <source src="vids/OO.MP4" type="video/mp4">
        Hindi supported ng browser ang video.
      </video>


      <!-- VIDEO PARA SA "HINDI AKO OK EH" -->
      <video id="notOkVideo" controls>
        <source src="vids/HINDI.MP4" type="video/mp4">
        Hindi supported ng browser ang video.
      </video>


      <br>

      <button class="back" onclick="goBack()">
        ← Balik
      </button>

    </div>

  </div>


  <!-- CODER INFORMATION -->
  <footer>

    <div class="coder">

      <!-- PALITAN ANG coder.jpg NG SARILI MONG PICTURE -->
      <img src="pic/6326.jpg" alt="Coder Picture">

      <div class="coder-text">

        <h3>About the Coder</h3>

        <p>
          <strong>Created by:</strong>
          JOHN VINCENT M. ELNAR
        </p>

        <p>
          <strong>GOAL:</strong>
          SAKTAN KA LALO BLEE!!!
        </p>

        <p>
          <strong>Made with:</strong>
          HTML • CSS • JavaScript
        </p>

        <p class="copyright">
          © 2026 JOHN VINCENT M. ELNAR. All rights reserved.
        </p>

      </div>

    </div>

  </footer>


  <script>

    function playVideo(videoId) {

      const question =
        document.getElementById("question");

      const videoContainer =
        document.getElementById("videoContainer");

      const videos =
        document.querySelectorAll("video");


      // Stop every video
      videos.forEach(video => {

        video.pause();

        video.currentTime = 0;

        video.style.display = "none";

      });


      // Hide question
      question.style.display = "none";


      // Show video container
      videoContainer.style.display = "block";


      // Get selected video
      const selectedVideo =
        document.getElementById(videoId);


      // Show selected video
      selectedVideo.style.display = "block";


      // Play video
      selectedVideo.play();

    }


    function goBack() {

      const question =
        document.getElementById("question");

      const videoContainer =
        document.getElementById("videoContainer");

      const videos =
        document.querySelectorAll("video");


      videos.forEach(video => {

        video.pause();

        video.currentTime = 0;

        video.style.display = "none";

      });


      videoContainer.style.display = "none";

      question.style.display = "block";

    }

  </script>

</body>
</html>
